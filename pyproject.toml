[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-minimax-h3-livepreview"
version = "1.0.0"
description = "MiniMax H3 live preview node: watch the video build up on the node body while H3 samples"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow"]

[project.optional-dependencies]
mp4 = ["av"]

[tool.comfy]
DisplayName = "MiniMax H3 Live Preview"
